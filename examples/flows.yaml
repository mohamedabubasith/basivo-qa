# Flows are intents, not selectors. The agent works out how to click each
# step every run, so a moved button does not break the flow.
#
# Copy this file to .qa/flows.yaml in your project and edit.

base_url: http://localhost:5173

# Files whose edits should trigger a re-run. Repo-relative globs. A flow can
# carry its own `watch:` list; then only edits matching it re-run that flow.
# Without any watch list nothing runs automatically; /qa is still manual.
watch:
  - apps/web/src/**

# Credentials live in .qa/secrets.env (dotenv format, add it to .gitignore):
#   QA_USER=you@example.com
#   QA_PASSWORD=...
# The agent types the *names* below; the browser tool swaps in the values and
# redacts them from everything the agent sees.
auth:
  login_path: /login
  user_secret: QA_USER
  password_secret: QA_PASSWORD

flows:
  - id: signup
    steps:
      - open /register
      - fill the form with a new random email and a strong password
      - submit
      - expect a message that says to check email, or a redirect into the app

  - id: login
    watch:
      - apps/web/src/routes/auth/**
      - apps/web/src/lib/auth*
    steps:
      - open /login
      - log in
      - expect to land inside the app, not on /login

  - id: create-flow
    depends_on: login
    steps:
      - click the button that creates a new item
      - expect the editor to open with an untitled item and no error toast

  - id: rename-and-save
    depends_on: create-flow
    steps:
      - rename the item to "QA smoke"
      - save with the keyboard shortcut
      - reload the page
      - expect the name "QA smoke" to still be there
